GameCapture.Buffering="Buffering (frame-locked build)"
GameCapture.Buffering.Description="Show frames by the game's own steady timeline instead of whatever was newest at each OBS tick, like a capture card with buffering. Removes the bursts of repeated and skipped frames when the game runs a hair off the OBS frame rate; a clock difference then shows as single, evenly spaced repeats or skips."
GameCapture.BufferDelay="Buffer delay (frames)"
GameCapture.BufferDelay.Description="How far behind the newest game frame the shown frame sits, in OBS frames. 2 is safe; 1 is the minimum. The video is delayed by this amount; the frame ring grows to delay + 4 slots when needed."
GameCapture.FrameRing="Frame ring limit (frame-locked build)"
GameCapture.FrameRing.Description="Most shared textures the game hook may rotate through (frame-locked build). The ring starts at buffer delay + 4 slots and grows on its own, up to this limit, when the game's present rate or its frame generation needs more (the capture restarts once for that). Every slot costs a full frame of video memory (33 MB at 4K). 1 behaves like stock OBS; a 6x frame-generation game needs 24. Takes effect at once; lowering it below the ring in use restarts the capture once."
GameCapture.FrameLog="Frame-lock debug log"
GameCapture.FrameLog.Description="While a recording is running, writes <recording>.frames.csv next to the recording file: every frame the hook captured from the game and the frame shown on each OBS tick. Diagnostics only; nothing about the capture changes."
